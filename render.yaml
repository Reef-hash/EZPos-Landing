services:
  - type: web
    name: ezpos-web-backend
    runtime: docker
    rootDir: src/EZPos.Web.Ui
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/var/data/ezpos_web_database.db
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__PublishableKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false
      - key: CrossxPos__HmacSecret
        sync: false

disks:
  - name: ezpos-web-data
    mountPath: /var/data
    sizeGB: 1
